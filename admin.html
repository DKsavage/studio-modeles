<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Studio Modèles — Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .dashboard { max-width: 1200px; margin: 0 auto; padding: 48px 24px; }
    .dashboard h2 { font-family: var(--font-titre); font-size: 2rem; font-weight: 300; margin-bottom: 32px; }
    .candidatures-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; }
    .card { border: 1px solid var(--gris-clair); border-radius: var(--radius); overflow: hidden; }
    .card-photos { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; background: var(--gris-clair); }
    .card-photos img { width: 100%; height: 200px; object-fit: cover; object-position: top; cursor: pointer; }
    .card-body { padding: 20px; }
    .card-name { font-family: var(--font-titre); font-size: 1.4rem; font-weight: 600; margin-bottom: 4px; }
    .card-meta { font-size: 0.78rem; color: var(--gris-texte); margin-bottom: 12px; }
    .card-info { font-size: 0.82rem; line-height: 1.8; }
    .badge { display: inline-block; background: var(--gris-clair); border-radius: 20px; padding: 2px 10px; font-size: 0.72rem; margin: 2px; }
    .loading { text-align: center; padding: 80px; color: var(--gris-texte); }
    .count { font-size: 0.82rem; color: var(--gris-texte); margin-bottom: 12px; }
    .search-input { width: 100%; padding: 13px 16px; border: 1px solid var(--gris-bord); border-radius: var(--radius); font-family: var(--font-corps); font-size: 0.92rem; margin-bottom: 20px; outline: none; background: var(--blanc); color: var(--noir); }
    .search-input:focus { border-color: var(--noir); box-shadow: 0 0 0 3px rgba(10,10,10,0.07); }
    .filters { display: flex; flex-wrap: wrap; gap: 20px; margin-bottom: 28px; padding-bottom: 24px; border-bottom: 1px solid var(--gris-clair); }
    .filter-group { display: flex; flex-direction: column; gap: 8px; }
    .filter-label { font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gris-texte); font-weight: 500; }
    .filter-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { padding: 5px 14px; border: 1px solid var(--gris-bord); border-radius: 20px; font-size: 0.75rem; font-family: var(--font-corps); cursor: pointer; background: var(--blanc); color: var(--gris-texte); transition: all 0.2s ease; }
    .chip:hover { border-color: var(--noir); color: var(--noir); }
    .chip.active { background: var(--noir); border-color: var(--noir); color: var(--blanc); }
    .reset-btn { align-self: flex-end; padding: 5px 14px; border: none; background: none; font-size: 0.75rem; color: var(--gris-texte); cursor: pointer; text-decoration: underline; font-family: var(--font-corps); }
    .reset-btn:hover { color: var(--noir); }
    .btn-select { width: 100%; margin-top: 16px; padding: 10px; border: 1px solid var(--noir); background: none; font-family: var(--font-corps); font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; color: var(--noir); transition: all 0.2s ease; }
    .btn-select:hover { background: var(--noir); color: var(--blanc); }
    .btn-select:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-select.sent { background: #2d6a4f; border-color: #2d6a4f; color: #fff; }
  </style>
</head>
<body>

  <header>
    <div class="logo">Studio<span>Modèles</span></div>
    <div style="display:flex;align-items:center;gap:12px;">
      <div class="header-badge">Dashboard Admin</div>
      <button onclick="sessionStorage.removeItem('admin_token');window.location.href='/login.html'" style="font-size:0.72rem;letter-spacing:0.1em;text-transform:uppercase;background:none;border:1px solid var(--gris-bord);padding:6px 14px;border-radius:20px;cursor:pointer;color:var(--gris-texte);font-family:var(--font-corps);">Déconnexion</button>
    </div>
  </header>

  <div class="dashboard">
    <h2>Candidatures</h2>
    <p class="count" id="count">Chargement…</p>

    <input type="search" id="search" class="search-input" placeholder="Rechercher par nom, email…" />

    <div class="filters">
      <div class="filter-group">
        <span class="filter-label">Genre</span>
        <div class="filter-chips">
          <button class="chip" data-filter="genre" data-value="Femme">Femme</button>
          <button class="chip" data-filter="genre" data-value="Homme">Homme</button>
        </div>
      </div>
      <div class="filter-group">
        <span class="filter-label">Expérience</span>
        <div class="filter-chips">
          <button class="chip" data-filter="experience" data-value="debutant">Débutant</button>
          <button class="chip" data-filter="experience" data-value="intermediaire">Intermédiaire</button>
          <button class="chip" data-filter="experience" data-value="confirme">Confirmé</button>
          <button class="chip" data-filter="experience" data-value="professionnel">Professionnel</button>
        </div>
      </div>
      <div class="filter-group">
        <span class="filter-label">Taille haut</span>
        <div class="filter-chips">
          <button class="chip" data-filter="taille_haut" data-value="XS">XS</button>
          <button class="chip" data-filter="taille_haut" data-value="S">S</button>
          <button class="chip" data-filter="taille_haut" data-value="M">M</button>
          <button class="chip" data-filter="taille_haut" data-value="L">L</button>
          <button class="chip" data-filter="taille_haut" data-value="XL">XL</button>
          <button class="chip" data-filter="taille_haut" data-value="XXL">XXL</button>
        </div>
      </div>
      <div class="filter-group">
        <span class="filter-label">Taille bas</span>
        <div class="filter-chips">
          <button class="chip" data-filter="taille_bas" data-value="XS">XS</button>
          <button class="chip" data-filter="taille_bas" data-value="S">S</button>
          <button class="chip" data-filter="taille_bas" data-value="M">M</button>
          <button class="chip" data-filter="taille_bas" data-value="L">L</button>
          <button class="chip" data-filter="taille_bas" data-value="XL">XL</button>
          <button class="chip" data-filter="taille_bas" data-value="XXL">XXL</button>
        </div>
      </div>
      <button class="reset-btn" id="reset">Réinitialiser</button>
    </div>

    <div class="candidatures-grid" id="grid">
      <p class="loading">Chargement des candidatures…</p>
    </div>
  </div>

  <script>
    /* ── Vérification auth — redirige vers login si pas de token ── */
    const adminToken = sessionStorage.getItem('admin_token');
    if (!adminToken) window.location.href = '/login.html';

    let allCandidatures = [];
    let activeFilters = { genre: null, experience: null, taille_haut: null, taille_bas: null };

    function applyFilters() {
      const q = document.getElementById('search').value.toLowerCase().trim();

      const filtered = allCandidatures.filter(c => {
        const matchSearch = !q ||
          `${c.prenom} ${c.nom} ${c.email}`.toLowerCase().includes(q);

        const matchGenre      = !activeFilters.genre      || c.genre      === activeFilters.genre;
        const matchExperience = !activeFilters.experience || c.experience === activeFilters.experience;
        const matchHaut       = !activeFilters.taille_haut|| c.taille_haut=== activeFilters.taille_haut;
        const matchBas        = !activeFilters.taille_bas || c.taille_bas === activeFilters.taille_bas;

        return matchSearch && matchGenre && matchExperience && matchHaut && matchBas;
      });

      renderCards(filtered);
    }

    function renderCards(data) {
      const grid = document.getElementById('grid');
      document.getElementById('count').textContent =
        `${data.length} candidature${data.length > 1 ? 's' : ''}`;

      if (data.length === 0) {
        grid.innerHTML = '<p class="loading">Aucun résultat.</p>';
        return;
      }

      grid.innerHTML = data.map(c => `
        <div class="card">
          <div class="card-photos">
            <img src="${c.photo_profil_signed || ''}" alt="Profil ${c.prenom}" onclick="window.open(this.src)" />
            <img src="${c.photo_body_signed   || ''}" alt="Body ${c.prenom}"   onclick="window.open(this.src)" />
          </div>
          <div class="card-body">
            <div class="card-name">${c.prenom} ${c.nom}</div>
            <div class="card-meta">${c.email} · ${c.telephone}</div>
            <div class="card-info">
              <span class="badge">${c.genre || '—'}</span>
              <span class="badge">${c.taille ? c.taille + ' cm' : '—'}</span>
              <span class="badge">${c.experience || '—'}</span>
              <span class="badge">Haut ${c.taille_haut || '—'}</span>
              <span class="badge">Bas ${c.taille_bas || '—'}</span>
              ${c.instagram ? `<br/><a href="${c.instagram}" target="_blank" style="font-size:0.78rem;color:var(--gris-texte)">${c.instagram}</a>` : ''}
            </div>
            <button
              class="btn-select"
              data-email="${c.email}"
              data-prenom="${c.prenom}"
              data-nom="${c.nom || ''}"
              onclick="selectModel(this)"
            >Sélectionner ce modèle</button>
          </div>
        </div>
      `).join('');
    }

    /* Chips — toggle actif/inactif */
    document.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', function() {
        const filter = this.dataset.filter;
        const value  = this.dataset.value;

        if (activeFilters[filter] === value) {
          /* Déjà actif → désactiver */
          activeFilters[filter] = null;
          this.classList.remove('active');
        } else {
          /* Activer ce chip, désactiver les autres du même groupe */
          document.querySelectorAll(`[data-filter="${filter}"]`).forEach(c => c.classList.remove('active'));
          activeFilters[filter] = value;
          this.classList.add('active');
        }

        applyFilters();
      });
    });

    /* Réinitialiser tous les filtres */
    document.getElementById('reset').addEventListener('click', function() {
      activeFilters = { genre: null, experience: null, taille_haut: null, taille_bas: null };
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      document.getElementById('search').value = '';
      renderCards(allCandidatures);
    });

    document.getElementById('search').addEventListener('input', applyFilters);

    async function loadCandidatures() {
      const grid = document.getElementById('grid');
      try {
        const res  = await fetch('/api/candidatures', {
          headers: { 'Authorization': `Bearer ${adminToken}` }
        });
        if (res.status === 401) { sessionStorage.removeItem('admin_token'); window.location.href = '/login.html'; return; }
        const json = await res.json();
        if (!json.success) throw new Error();
        allCandidatures = json.data;
        renderCards(allCandidatures);
      } catch {
        grid.innerHTML = '<p class="loading">Erreur de chargement.</p>';
      }
    }

    async function selectModel(btn) {
      const { email, prenom, nom } = btn.dataset;
      if (!confirm(`Envoyer l'email de sélection à ${prenom} ${nom} ?`)) return;

      btn.disabled = true;
      btn.textContent = 'Envoi en cours…';

      try {
        const res = await fetch('/api/select', {
          method: 'POST',
          headers: {
            'Content-Type':  'application/json',
            'Authorization': `Bearer ${adminToken}`,
          },
          body: JSON.stringify({ email, prenom, nom }),
        });
        const json = await res.json();
        if (!json.success) throw new Error(json.message);
        btn.textContent = 'Email envoyé ✓';
        btn.classList.add('sent');
      } catch (err) {
        alert('Erreur : ' + (err.message || 'réessaie.'));
        btn.disabled = false;
        btn.textContent = 'Sélectionner ce modèle';
      }
    }

    loadCandidatures();
  </script>

</body>
</html>
