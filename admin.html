<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lumina Photography — Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <div class="logo">Lumina<span>Photography</span></div>
    <div class="flex items-center gap-3">
      <div class="header-badge">Dashboard Admin</div>
      <button
        onclick="sessionStorage.removeItem('admin_token');window.location.href='/login.html'"
        class="font-corps text-xs tracking-widest uppercase bg-transparent border border-gray-200 px-4 py-1.5 rounded-full cursor-pointer text-gray-400 hover:border-gray-900 hover:text-gray-900 transition-all duration-200"
      >Déconnexion</button>
    </div>
  </header>

  <div class="dashboard">

    <div class="flex items-baseline justify-between mb-6">
      <h2>Candidatures</h2>
      <p class="count" id="count">Chargement…</p>
    </div>

    <!-- Stats animées -->
    <div class="stats-bar">
      <div class="stat-block">
        <span class="stat-num" id="stat-total">—</span>
        <span class="stat-label">total</span>
      </div>
      <div class="stat-sep"></div>
      <div class="stat-block">
        <span class="stat-num" id="stat-femmes">—</span>
        <span class="stat-label">femmes</span>
      </div>
      <div class="stat-sep"></div>
      <div class="stat-block">
        <span class="stat-num" id="stat-hommes">—</span>
        <span class="stat-label">hommes</span>
      </div>
      <div class="stat-sep"></div>
      <div class="stat-block">
        <span class="stat-num stat-num-text" id="stat-exp">—</span>
        <span class="stat-label">expérience dominante</span>
      </div>
    </div>

    <!-- Recherche avec icône -->
    <div class="search-wrapper" id="search-wrapper">
      <span class="search-icon" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <circle cx="6.5" cy="6.5" r="5" stroke="currentColor" stroke-width="1.5"/>
          <path d="M10 10l4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </span>
      <input type="search" id="search" class="search-input" placeholder="Rechercher par nom, email…" autocomplete="off" />
      <button class="search-clear" id="search-clear" aria-label="Effacer">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
          <path d="M1 1l10 10M11 1L1 11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <div class="filters">
      <div class="filter-group">
        <span class="filter-label">Genre</span>
        <div class="filter-chips">
          <button class="chip" data-filter="genre" data-value="Femme">Femme</button>
          <button class="chip" data-filter="genre" data-value="Homme">Homme</button>
        </div>
      </div>
      <div class="filter-group">
        <span class="filter-label">Expérience</span>
        <div class="filter-chips">
          <button class="chip" data-filter="experience" data-value="debutant">Débutant</button>
          <button class="chip" data-filter="experience" data-value="intermediaire">Intermédiaire</button>
          <button class="chip" data-filter="experience" data-value="confirme">Confirmé</button>
          <button class="chip" data-filter="experience" data-value="professionnel">Professionnel</button>
        </div>
      </div>
      <div class="filter-group">
        <span class="filter-label">Taille haut</span>
        <div class="filter-chips">
          <button class="chip" data-filter="taille_haut" data-value="XS">XS</button>
          <button class="chip" data-filter="taille_haut" data-value="S">S</button>
          <button class="chip" data-filter="taille_haut" data-value="M">M</button>
          <button class="chip" data-filter="taille_haut" data-value="L">L</button>
          <button class="chip" data-filter="taille_haut" data-value="XL">XL</button>
          <button class="chip" data-filter="taille_haut" data-value="XXL">XXL</button>
        </div>
      </div>
      <div class="filter-group">
        <span class="filter-label">Taille bas</span>
        <div class="filter-chips">
          <button class="chip" data-filter="taille_bas" data-value="XS">XS</button>
          <button class="chip" data-filter="taille_bas" data-value="S">S</button>
          <button class="chip" data-filter="taille_bas" data-value="M">M</button>
          <button class="chip" data-filter="taille_bas" data-value="L">L</button>
          <button class="chip" data-filter="taille_bas" data-value="XL">XL</button>
          <button class="chip" data-filter="taille_bas" data-value="XXL">XXL</button>
        </div>
      </div>
      <button class="reset-btn" id="reset">Réinitialiser</button>
      <div class="view-toggle">
        <button class="view-btn active" id="btn-grid" title="Vue grille">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <rect x="0.5" y="0.5" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.5"/>
            <rect x="8.5" y="0.5" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.5"/>
            <rect x="0.5" y="8.5" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.5"/>
            <rect x="8.5" y="8.5" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.5"/>
          </svg>
        </button>
        <button class="view-btn" id="btn-list" title="Vue liste">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M0.5 2.5h13M0.5 7h13M0.5 11.5h13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="candidatures-grid" id="grid"></div>
  </div>

  <!-- Barre d'action flottante (sélection multiple) -->
  <div class="action-bar" id="action-bar" aria-live="polite">
    <div class="action-bar-inner">
      <div class="action-bar-info">
        <span class="action-bar-dot"></span>
        <span id="selection-count">0 sélectionné</span>
        <button class="action-bar-clear" id="btn-clear-selection">Tout désélectionner</button>
      </div>
      <div class="flex items-center gap-2 flex-shrink-0">
        <!-- Étape 1 : notification simple "vous êtes sélectionné(e)" -->
        <button class="action-bar-btn-notify" id="btn-notify">Notifier</button>
        <!-- Étape 2 : composer avec tous les détails de la session -->
        <button class="action-bar-btn" id="btn-open-composer">
          Détails de la session
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none" style="margin-left:7px;vertical-align:-2px" aria-hidden="true">
            <path d="M1 6.5h11M6.5 1l5.5 5.5-5.5 5.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- ── COMPOSER DE SESSION ────────────────────────────────── -->
  <div class="composer-overlay" id="composer-overlay" role="dialog" aria-modal="true" aria-labelledby="composer-title">
    <div class="composer">

      <div class="composer-header">
        <div>
          <div class="composer-title" id="composer-title">Composer le message</div>
          <div class="composer-subtitle" id="composer-subtitle"></div>
        </div>
        <button class="composer-close" id="composer-close" aria-label="Fermer">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M1 1l14 14M15 1L1 15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
      </div>

      <!-- Formulaire -->
      <div class="composer-body" id="composer-form">

        <div class="crow">
          <div class="cfield">
            <label class="clabel" for="c-project">Nom du projet</label>
            <input type="text" id="c-project" placeholder="ex : Maison Locht SS26" />
          </div>
          <div class="cfield">
            <label class="clabel" for="c-date">Date</label>
            <input type="text" id="c-date" placeholder="ex : 17 mai 2026 / May 17, 2026" />
          </div>
        </div>

        <div class="cfield">
          <label class="clabel" for="c-addr-fr">Adresse (FR)</label>
          <input type="text" id="c-addr-fr" placeholder="3081 Rue Ontario Est, suite 303 (Préfontaine)" />
        </div>
        <div class="cfield">
          <label class="clabel" for="c-addr-en">Adresse (EN)</label>
          <input type="text" id="c-addr-en" placeholder="3081 Ontario Street East, Suite 303" />
        </div>

        <div class="cfield-header">
          <span class="clabel">Groupes &amp; call times</span>
          <button class="c-link-btn" id="c-add-group">+ Ajouter un groupe</button>
        </div>
        <div class="c-group-labels">
          <span class="c-glabel">Nom du groupe</span>
          <span class="c-glabel">Heure</span>
          <span class="c-glabel">Modèles (séparés par des virgules)</span>
        </div>
        <div id="c-groups"></div>

        <div class="crow" style="margin-top:4px">
          <div class="cfield">
            <label class="clabel" for="c-notes-fr">Notes FR <span class="clabel-opt">optionnel</span></label>
            <textarea id="c-notes-fr" rows="2" placeholder="Ex : Veuillez apporter vos chaussures noires."></textarea>
          </div>
          <div class="cfield">
            <label class="clabel" for="c-notes-en">Notes EN <span class="clabel-opt">optional</span></label>
            <textarea id="c-notes-en" rows="2" placeholder="Ex : Please bring your black shoes."></textarea>
          </div>
        </div>

        <div class="c-options">
          <label class="c-toggle-row">
            <input type="checkbox" id="c-unpaid" checked />
            <span>Participation non rémunérée + droits à l'image</span>
          </label>
          <label class="c-toggle-row">
            <input type="checkbox" id="c-moodboard" checked />
            <span>Moodboard joint au courriel</span>
          </label>
          <div>
            <label class="c-toggle-row">
              <input type="checkbox" id="c-wa-toggle" />
              <span>Lien WhatsApp</span>
            </label>
            <input type="text" id="c-wa-link" class="c-wa-input" style="display:none"
                   placeholder="https://chat.whatsapp.com/…" />
          </div>
        </div>

      </div>
      <!-- Fin formulaire -->

      <!-- Aperçu -->
      <div class="c-preview-pane" id="c-preview-pane"></div>

      <div class="composer-footer">
        <button class="c-btn-preview" id="c-btn-preview">Prévisualiser</button>
        <button class="c-btn-send" id="c-btn-send">
          Envoyer
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none" aria-hidden="true">
            <path d="M1 6.5h11M6.5 1l5.5 5.5-5.5 5.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>

    </div>
  </div>
  <!-- Fin composer -->

  <!-- Toast de notification -->
  <div class="toast" id="toast"></div>

  <script>
    const adminToken = sessionStorage.getItem('admin_token');
    if (!adminToken) window.location.href = '/login.html';

    let allCandidatures = [];
    let activeFilters = { genre: null, experience: null, taille_haut: null, taille_bas: null };

    /* ── État de sélection ──────────────────────────────────── */
    const selectedModels = new Map(); /* email → { prenom, nom } */
    const sentEmails     = new Set(); /* emails déjà envoyés (persisté par session) */

    /* ── Skeleton ───────────────────────────────────────────── */
    function renderSkeleton() {
      document.getElementById('grid').innerHTML = Array(6).fill('').map(() => `
        <div class="skeleton-card">
          <div class="skeleton-block" style="aspect-ratio:3/4;width:100%"></div>
          <div class="skeleton-body">
            <div class="skeleton-block skeleton-line" style="width:55%"></div>
            <div class="skeleton-block skeleton-line" style="width:80%"></div>
            <div class="skeleton-block skeleton-line" style="width:40%"></div>
          </div>
        </div>
      `).join('');
    }
    renderSkeleton();

    /* ── Filtres ────────────────────────────────────────────── */
    function applyFilters() {
      const q = document.getElementById('search').value.toLowerCase().trim();
      const filtered = allCandidatures.filter(c => {
        const matchSearch     = !q || `${c.prenom} ${c.nom} ${c.email}`.toLowerCase().includes(q);
        const matchGenre      = !activeFilters.genre      || c.genre      === activeFilters.genre;
        const matchExperience = !activeFilters.experience || c.experience === activeFilters.experience;
        const matchHaut       = !activeFilters.taille_haut|| c.taille_haut=== activeFilters.taille_haut;
        const matchBas        = !activeFilters.taille_bas || c.taille_bas === activeFilters.taille_bas;
        return matchSearch && matchGenre && matchExperience && matchHaut && matchBas;
      });
      renderCards(filtered);
    }

    /* ── Rendu des cartes ───────────────────────────────────── */
    function renderCards(data) {
      const grid = document.getElementById('grid');
      document.getElementById('count').textContent =
        `${data.length} candidature${data.length > 1 ? 's' : ''}`;

      if (data.length === 0) {
        grid.innerHTML = '<p class="loading">Aucun résultat.</p>';
        return;
      }

      grid.innerHTML = data.map((c, i) => {
        const checked = selectedModels.has(c.email);
        const sent    = sentEmails.has(c.email);
        return `
        <div class="card${checked ? ' card-checked' : ''}${sent ? ' is-selected' : ''}"
             style="animation-delay:${i * 50}ms">

          <div class="card-photos-portrait">
            <img src="${c.photo_profil_signed || ''}" alt="Profil ${c.prenom}"
                 class="card-photo-main" onclick="window.open(this.src)" />
            <img src="${c.photo_body_signed   || ''}" alt="Corps ${c.prenom}"
                 class="card-photo-hover" onclick="window.open(this.src)" />

            <div class="card-glass-overlay">
              <div class="card-name-overlay">${c.prenom} ${c.nom}</div>
              <div class="flex flex-wrap gap-1 mt-1">
                ${c.genre      ? `<span class="badge-glass">${c.genre}</span>`      : ''}
                ${c.taille     ? `<span class="badge-glass">${c.taille} cm</span>`  : ''}
                ${c.experience ? `<span class="badge-glass">${c.experience}</span>` : ''}
              </div>
            </div>

            <!-- Bouton de sélection (cercle) -->
            <button
              class="btn-check${checked ? ' checked' : ''}"
              data-email="${c.email}"
              data-prenom="${c.prenom}"
              data-nom="${c.nom || ''}"
              onclick="toggleSelect(this)"
              aria-label="Sélectionner ${c.prenom} ${c.nom}"
              ${sent ? 'disabled' : ''}
            ></button>

            <div class="selected-overlay"></div>
            <div class="selected-badge">✓ Envoyé</div>
          </div>

          <div class="card-body-minimal">
            <div class="card-name card-name-list">${c.prenom} ${c.nom}</div>
            <div class="card-meta">${c.email} · ${c.telephone}</div>
            <div class="flex flex-wrap gap-1 mt-2 mb-2">
              <span class="badge">Haut ${c.taille_haut || '—'}</span>
              <span class="badge">Bas  ${c.taille_bas   || '—'}</span>
            </div>
            ${c.instagram
              ? `<a href="${c.instagram}" target="_blank"
                   class="text-xs text-gray-400 hover:text-rouge transition-colors duration-200 break-all block">${c.instagram}</a>`
              : ''}
          </div>

        </div>`;
      }).join('');
    }

    /* ── Sélection multiple ─────────────────────────────────── */
    function toggleSelect(btn) {
      const email  = btn.dataset.email;
      const prenom = btn.dataset.prenom;
      const nom    = btn.dataset.nom;
      const card   = btn.closest('.card');

      if (selectedModels.has(email)) {
        selectedModels.delete(email);
        card.classList.remove('card-checked');
        btn.classList.remove('checked');
      } else {
        selectedModels.set(email, { prenom, nom });
        card.classList.add('card-checked');
        btn.classList.add('checked');
      }
      updateActionBar();
    }

    function updateActionBar() {
      const count = selectedModels.size;
      const bar   = document.getElementById('action-bar');
      const label = count === 1
        ? '1 modèle sélectionné'
        : `${count} modèles sélectionnés`;
      document.getElementById('selection-count').textContent = label;
      bar.classList.toggle('visible', count > 0);
    }

    function clearSelection() {
      selectedModels.clear();
      document.querySelectorAll('.card-checked').forEach(c => c.classList.remove('card-checked'));
      document.querySelectorAll('.btn-check.checked').forEach(b => b.classList.remove('checked'));
      updateActionBar();
    }

    /* ── Étape 1 : notification simple "vous êtes sélectionné(e)" ── */
    async function sendNotify() {
      const btn    = document.getElementById('btn-notify');
      const models = [...selectedModels.entries()];
      if (!models.length) return;

      btn.disabled    = true;
      btn.textContent = 'Envoi…';

      const results = await Promise.allSettled(
        models.map(([email, { prenom, nom }]) =>
          fetch('/api/select', {
            method: 'POST',
            headers: {
              'Content-Type':  'application/json',
              'Authorization': `Bearer ${adminToken}`,
            },
            body: JSON.stringify({ email, prenom, nom }),
          }).then(r => ({ ok: r.ok, email }))
        )
      );

      let success = 0, fail = 0;

      results.forEach(result => {
        if (result.status === 'fulfilled' && result.value.ok) {
          const email = result.value.email;
          sentEmails.add(email);
          success++;
          document.querySelectorAll('.btn-check').forEach(b => {
            if (b.dataset.email === email) {
              const card = b.closest('.card');
              card.classList.add('is-selected');
              card.classList.remove('card-checked');
              b.classList.remove('checked');
              b.disabled = true;
            }
          });
        } else { fail++; }
      });

      selectedModels.clear();
      updateActionBar();
      btn.disabled    = false;
      btn.textContent = 'Notifier';

      if (fail === 0) showToast(`${success} notification${success > 1 ? 's' : ''} envoyée${success > 1 ? 's' : ''} ✓`, 'success');
      else            showToast(`${success} envoyée${success > 1 ? 's' : ''} · ${fail} échec${fail > 1 ? 's' : ''}`, 'error');
    }

    /* ── Étape 2 : composer de session ──────────────────────── */
    let _groupCount  = 0;
    let _previewMode = false;

    function openComposer() {
      const count = selectedModels.size;
      if (!count) return;

      _groupCount  = 0;
      _previewMode = false;

      document.getElementById('composer-subtitle').textContent =
        `${count} modèle${count > 1 ? 's' : ''} sélectionné${count > 1 ? 's' : ''}`;

      /* Pré-remplir le groupe 1 avec les prénoms sélectionnés */
      document.getElementById('c-groups').innerHTML = '';
      const names = [...selectedModels.values()].map(m => m.prenom).join(', ');
      addGroup(names, '', '');

      /* Réinitialiser vue */
      document.getElementById('composer-form').style.display   = '';
      document.getElementById('c-preview-pane').style.display  = 'none';
      document.getElementById('c-btn-preview').textContent     = 'Prévisualiser';

      const sendBtn    = document.getElementById('c-btn-send');
      sendBtn.disabled = false;
      sendBtn.innerHTML = `Envoyer à ${count} modèle${count > 1 ? 's' : ''} <svg width="13" height="13" viewBox="0 0 13 13" fill="none" aria-hidden="true"><path d="M1 6.5h11M6.5 1l5.5 5.5-5.5 5.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

      document.getElementById('composer-overlay').classList.add('visible');
      document.body.style.overflow = 'hidden';
    }

    function closeComposer() {
      document.getElementById('composer-overlay').classList.remove('visible');
      document.body.style.overflow = '';
    }

    function addGroup(defaultMembers = '', defaultName = '', defaultTime = '') {
      _groupCount++;
      const isFirst = _groupCount === 1;
      const el = document.createElement('div');
      el.className = 'c-group';
      el.innerHTML = `
        <div class="c-group-fields">
          <input class="c-group-name"    type="text" placeholder="ex : Filles" />
          <input class="c-group-time"    type="text" placeholder="08h30" />
          <input class="c-group-members" type="text" placeholder="Sara, Luna…" />
        </div>
        ${!isFirst ? '<button class="c-remove-group" aria-label="Supprimer ce groupe">✕</button>' : ''}
      `;
      el.querySelector('.c-group-name').value    = defaultName;
      el.querySelector('.c-group-time').value    = defaultTime;
      el.querySelector('.c-group-members').value = defaultMembers;
      if (!isFirst) el.querySelector('.c-remove-group').addEventListener('click', () => el.remove());
      document.getElementById('c-groups').appendChild(el);
    }

    function getComposerData() {
      const groups = [...document.querySelectorAll('.c-group')].map(g => ({
        name:    g.querySelector('.c-group-name').value.trim(),
        time:    g.querySelector('.c-group-time').value.trim(),
        members: g.querySelector('.c-group-members').value.trim(),
      }));
      return {
        models:    [...selectedModels.entries()].map(([email, { prenom, nom }]) => ({ email, prenom, nom })),
        project:   document.getElementById('c-project').value.trim(),
        date:      document.getElementById('c-date').value.trim(),
        addressFr: document.getElementById('c-addr-fr').value.trim(),
        addressEn: document.getElementById('c-addr-en').value.trim(),
        groups,
        notesFr:   document.getElementById('c-notes-fr').value.trim(),
        notesEn:   document.getElementById('c-notes-en').value.trim(),
        unpaid:    document.getElementById('c-unpaid').checked,
        moodboard: document.getElementById('c-moodboard').checked,
        whatsapp:  document.getElementById('c-wa-toggle').checked ? document.getElementById('c-wa-link').value.trim() : '',
      };
    }

    function buildPreview(data) {
      const groupLines = data.groups
        .filter(g => g.time || g.members || g.name)
        .map(g => {
          const label = [g.name, g.members ? `(${g.members})` : ''].filter(Boolean).join(' ');
          return `<div style="margin-bottom:4px"><strong>${label}</strong>${g.time ? ` — ${g.time}` : ''}</div>`;
        }).join('');

      return `
        <span class="preview-lang-label">Aperçu — version française</span>
        <div class="preview-email-box">
          <p>Bonsoir <strong>[Prénom]</strong>,</p>
          <p>J'espère que vous allez bien.<br>
          Vous avez été sélectionné(e) pour participer au photoshoot
          <strong>${data.project || '[Nom du projet]'}</strong>, qui se tiendra le
          <strong>${data.date || '[Date]'}</strong>.
          Nous sommes ravis(es) de vous avoir à bord.</p>
          <span class="preview-section-label">📍 Lieu</span>
          <p>${data.addressFr || '<em style="color:#b0b0b0">[Adresse FR]</em>'}</p>
          <span class="preview-section-label">🕐 Heure de call time</span>
          <div style="margin-bottom:14px">${groupLines || '<em style="color:#b0b0b0">[Groupes]</em>'}</div>
          ${data.moodboard ? '<p>Le moodboard est joint à ce courriel.</p>' : ''}
          ${data.notesFr   ? `<p>${data.notesFr}</p>` : ''}
          ${data.whatsapp  ? `<p>Lien WhatsApp : ${data.whatsapp}</p>` : ''}
          <p>Merci de répondre à ce courriel pour confirmer votre présence.</p>
          ${data.unpaid ? '<p style="font-size:0.85em;color:var(--gris-texte)">Veuillez noter que cette participation est non rémunérée. Un contrat d\'autorisation de droits à l\'image vous sera remis à l\'issue de la session.</p>' : ''}
          <p>Au plaisir de vous retrouver !</p>
          <hr class="preview-divider" />
          <p style="color:var(--gris-texte);font-size:0.85em">— La version anglaise suit dans le même email —</p>
          <div class="preview-email-signature">
            <strong style="font-family:var(--font-titre);letter-spacing:0.06em">Lumina</strong> Photography<br>
            casting@luminamodels.ca · luminamodels.ca · Montréal
          </div>
        </div>
        <p style="font-size:0.76rem;color:var(--gris-texte);margin-top:10px;text-align:center">
          Destinataires : ${data.models.map(m => m.prenom).join(', ')}
        </p>
      `;
    }

    function togglePreview() {
      _previewMode = !_previewMode;
      if (_previewMode) {
        document.getElementById('c-preview-pane').innerHTML = buildPreview(getComposerData());
        document.getElementById('composer-form').style.display  = 'none';
        document.getElementById('c-preview-pane').style.display = 'block';
        document.getElementById('c-btn-preview').textContent    = '← Retour';
      } else {
        document.getElementById('composer-form').style.display  = '';
        document.getElementById('c-preview-pane').style.display = 'none';
        document.getElementById('c-btn-preview').textContent    = 'Prévisualiser';
      }
    }

    async function sendSession() {
      const data    = getComposerData();
      const sendBtn = document.getElementById('c-btn-send');

      if (!data.project)   return showToast('Ajoute le nom du projet.', 'error');
      if (!data.date)      return showToast('Ajoute la date.', 'error');
      if (!data.addressFr) return showToast("Ajoute l'adresse (FR).", 'error');

      const savedHTML   = sendBtn.innerHTML;
      sendBtn.disabled  = true;
      sendBtn.innerHTML = 'Envoi en cours…';

      try {
        const res  = await fetch('/api/send-session', {
          method: 'POST',
          headers: {
            'Content-Type':  'application/json',
            'Authorization': `Bearer ${adminToken}`,
          },
          body: JSON.stringify(data),
        });
        const json = await res.json();
        if (!json.success) throw new Error(json.message);

        data.models.forEach(({ email }) => {
          sentEmails.add(email);
          document.querySelectorAll('.btn-check').forEach(b => {
            if (b.dataset.email === email) {
              const card = b.closest('.card');
              card.classList.add('is-selected');
              card.classList.remove('card-checked');
              b.classList.remove('checked');
              b.disabled = true;
            }
          });
        });

        clearSelection();
        closeComposer();
        showToast(`Session envoyée à ${json.sent} modèle${json.sent > 1 ? 's' : ''} ✓`, 'success');

      } catch {
        showToast("Erreur lors de l'envoi. Réessaie.", 'error');
        sendBtn.disabled = false;
        sendBtn.innerHTML = savedHTML;
      }
    }

    /* Événements du composer */
    document.getElementById('composer-close').addEventListener('click', closeComposer);
    document.getElementById('composer-overlay').addEventListener('click', e => {
      if (e.target === e.currentTarget) closeComposer();
    });
    document.getElementById('c-add-group').addEventListener('click', () => addGroup());
    document.getElementById('c-btn-preview').addEventListener('click', togglePreview);
    document.getElementById('c-btn-send').addEventListener('click', sendSession);
    document.getElementById('c-wa-toggle').addEventListener('change', function () {
      document.getElementById('c-wa-link').style.display = this.checked ? 'block' : 'none';
      if (this.checked) document.getElementById('c-wa-link').focus();
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && document.getElementById('composer-overlay').classList.contains('visible')) {
        closeComposer();
      }
    });

    /* ── Toast de notification ──────────────────────────────── */
    let toastTimer;
    function showToast(msg, type = 'success') {
      const toast = document.getElementById('toast');
      clearTimeout(toastTimer);
      toast.textContent = msg;
      toast.className   = `toast ${type} visible`;
      toastTimer = setTimeout(() => toast.classList.remove('visible'), 3500);
    }

    /* ── Stats count-up ─────────────────────────────────────── */
    function countUp(el, target, duration = 900) {
      const start = performance.now();
      function step(now) {
        const p = Math.min((now - start) / duration, 1);
        el.textContent = Math.floor(p * target);
        if (p < 1) requestAnimationFrame(step);
        else el.textContent = target;
      }
      requestAnimationFrame(step);
    }

    function updateStats(data) {
      const femmes = data.filter(c => c.genre === 'Femme').length;
      const hommes = data.filter(c => c.genre === 'Homme').length;
      const expCount = {};
      data.forEach(c => {
        if (c.experience) expCount[c.experience] = (expCount[c.experience] || 0) + 1;
      });
      const topExp = Object.entries(expCount).sort((a, b) => b[1] - a[1])[0];

      countUp(document.getElementById('stat-total'),  data.length);
      countUp(document.getElementById('stat-femmes'), femmes);
      countUp(document.getElementById('stat-hommes'), hommes);
      document.getElementById('stat-exp').textContent = topExp ? topExp[0] : '—';
    }

    /* ── Chips filtres ──────────────────────────────────────── */
    document.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', function () {
        const filter = this.dataset.filter;
        const value  = this.dataset.value;
        if (activeFilters[filter] === value) {
          activeFilters[filter] = null;
          this.classList.remove('active');
        } else {
          document.querySelectorAll(`[data-filter="${filter}"]`).forEach(c => c.classList.remove('active'));
          activeFilters[filter] = value;
          this.classList.add('active');
        }
        applyFilters();
      });
    });

    document.getElementById('reset').addEventListener('click', function () {
      activeFilters = { genre: null, experience: null, taille_haut: null, taille_bas: null };
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      document.getElementById('search').value = '';
      document.getElementById('search-wrapper').classList.remove('has-value');
      renderCards(allCandidatures);
    });

    /* ── Recherche ──────────────────────────────────────────── */
    const searchInput   = document.getElementById('search');
    const searchWrapper = document.getElementById('search-wrapper');

    searchInput.addEventListener('input', function () {
      searchWrapper.classList.toggle('has-value', !!this.value);
      applyFilters();
    });

    document.getElementById('search-clear').addEventListener('click', function () {
      searchInput.value = '';
      searchWrapper.classList.remove('has-value');
      searchInput.focus();
      applyFilters();
    });

    /* ── Toggle grille / liste ──────────────────────────────── */
    document.getElementById('btn-grid').addEventListener('click', function () {
      document.getElementById('grid').classList.remove('list-view');
      this.classList.add('active');
      document.getElementById('btn-list').classList.remove('active');
    });

    document.getElementById('btn-list').addEventListener('click', function () {
      document.getElementById('grid').classList.add('list-view');
      this.classList.add('active');
      document.getElementById('btn-grid').classList.remove('active');
    });

    /* ── Action bar ─────────────────────────────────────────── */
    document.getElementById('btn-clear-selection').addEventListener('click', clearSelection);
    document.getElementById('btn-notify').addEventListener('click', sendNotify);
    document.getElementById('btn-open-composer').addEventListener('click', openComposer);

    /* ── Chargement API ─────────────────────────────────────── */
    async function loadCandidatures() {
      const grid = document.getElementById('grid');
      try {
        const res  = await fetch('/api/candidatures', {
          headers: { 'Authorization': `Bearer ${adminToken}` }
        });
        if (res.status === 401) {
          sessionStorage.removeItem('admin_token');
          window.location.href = '/login.html';
          return;
        }
        const json = await res.json();
        if (!json.success) throw new Error();
        allCandidatures = json.data;
        renderCards(allCandidatures);
        updateStats(allCandidatures);
      } catch {
        grid.innerHTML = '<p class="loading">Erreur de chargement.</p>';
      }
    }

    loadCandidatures();
  </script>

</body>
</html>
