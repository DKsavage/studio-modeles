<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lumina Photography — Connexion</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; flex-direction: column; gap: 0; }
  </style>
</head>
<body>

  <header style="width:100%;">
    <div class="logo">Lumina<span>Photography</span></div>
    <div class="header-badge">Espace Admin</div>
  </header>

  <div class="login-box">
    <div class="login-title">Connexion</div>
    <div class="login-subtitle">Accès réservé aux administrateurs</div>

    <div class="tabs">
      <button class="tab active" data-tab="otp">Code par email</button>
      <button class="tab" data-tab="password">Mot de passe</button>
    </div>

    <!-- ── ONGLET OTP ── -->
    <div class="tab-panel active" id="panel-otp">

      <!-- Étape 1 : saisir l'email -->
      <div class="otp-step1" id="otp-step1">
        <div class="field">
          <label for="otp-email">Adresse email</label>
          <input type="email" id="otp-email" placeholder="admin@studiomodeles.com" />
        </div>
        <button class="btn" id="btn-send-otp">Recevoir mon code</button>
      </div>

      <!-- Étape 2 : saisir le code reçu -->
      <div class="otp-step2" id="otp-step2">
        <p class="msg-info">Code envoyé à <strong id="otp-email-display"></strong>. Vérifie ta boîte mail.</p>
        <div class="field">
          <label for="otp-code">Code à 6 chiffres</label>
          <input type="text" id="otp-code" class="code-input" placeholder="000000" maxlength="6" inputmode="numeric" />
        </div>
        <button class="btn" id="btn-verify-otp">Connexion</button>
        <button class="btn btn-secondary" id="btn-resend">Renvoyer le code</button>
      </div>

      <p class="msg-error" id="otp-error"></p>
    </div>

    <!-- ── ONGLET MOT DE PASSE ── -->
    <div class="tab-panel" id="panel-password">
      <div class="field">
        <label for="pw-email">Adresse email</label>
        <input type="email" id="pw-email" placeholder="admin@studiomodeles.com" />
      </div>
      <div class="field">
        <label for="pw-password">Mot de passe</label>
        <input type="password" id="pw-password" placeholder="••••••••" />
      </div>
      <button class="btn" id="btn-login">Se connecter</button>
      <p class="msg-error" id="pw-error"></p>
    </div>
  </div>

  <script>
    /* ── Navigation entre onglets ── */
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', function() {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        this.classList.add('active');
        document.getElementById(`panel-${this.dataset.tab}`).classList.add('active');
      });
    });

    function showError(id, msg) {
      const el = document.getElementById(id);
      el.textContent = msg;
      el.classList.add('visible');
    }

    function hideError(id) {
      document.getElementById(id).classList.remove('visible');
    }

    function saveAndRedirect(token) {
      sessionStorage.setItem('admin_token', token);
      window.location.href = '/admin.html';
    }

    /* ── OTP — Étape 1 : envoyer le code ── */
    async function sendOtp() {
      const email = document.getElementById('otp-email').value.trim();
      if (!email) return showError('otp-error', 'Saisis ton email.');
      hideError('otp-error');

      const btn = document.getElementById('btn-send-otp');
      btn.disabled = true;
      btn.textContent = 'Envoi…';

      const res = await fetch('/api/otp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email }),
      });

      btn.disabled = false;
      btn.textContent = 'Recevoir mon code';

      if (!res.ok) {
        const json = await res.json();
        return showError('otp-error', json.message || 'Erreur.');
      }

      /* Passer à l'étape 2 */
      document.getElementById('otp-email-display').textContent = email;
      document.getElementById('otp-step1').classList.add('hidden');
      document.getElementById('otp-step2').classList.add('visible');
    }

    /* ── OTP — Étape 2 : vérifier le code ── */
    async function verifyOtp() {
      const email = document.getElementById('otp-email').value.trim();
      const token = document.getElementById('otp-code').value.trim();
      if (!token) return showError('otp-error', 'Saisis le code reçu.');
      hideError('otp-error');

      const btn = document.getElementById('btn-verify-otp');
      btn.disabled = true;
      btn.textContent = 'Vérification…';

      const res = await fetch('/api/verify-otp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, token }),
      });

      const json = await res.json();
      btn.disabled = false;
      btn.textContent = 'Connexion';

      if (!json.success) return showError('otp-error', json.message || 'Code invalide.');
      saveAndRedirect(json.token);
    }

    document.getElementById('btn-send-otp').addEventListener('click', sendOtp);
    document.getElementById('btn-verify-otp').addEventListener('click', verifyOtp);
    document.getElementById('btn-resend').addEventListener('click', () => {
      document.getElementById('otp-step1').classList.remove('hidden');
      document.getElementById('otp-step2').classList.remove('visible');
      hideError('otp-error');
    });

    /* Appuyer Entrée sur le code → vérifier */
    document.getElementById('otp-code').addEventListener('keydown', e => {
      if (e.key === 'Enter') verifyOtp();
    });

    /* ── Mot de passe ── */
    document.getElementById('btn-login').addEventListener('click', async function() {
      const email    = document.getElementById('pw-email').value.trim();
      const password = document.getElementById('pw-password').value;
      if (!email || !password) return showError('pw-error', 'Remplis tous les champs.');
      hideError('pw-error');

      this.disabled = true;
      this.textContent = 'Connexion…';

      const res  = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });

      const json = await res.json();
      this.disabled = false;
      this.textContent = 'Se connecter';

      if (!json.success) return showError('pw-error', json.message || 'Identifiants incorrects.');
      saveAndRedirect(json.token);
    });
  </script>

</body>
</html>
