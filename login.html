<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lumina Photography — Connexion</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="flex flex-col items-center justify-center min-h-screen bg-gray-50 px-4">

  <!-- Blobs rouge flottants en arrière-plan -->
  <div class="login-blobs" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <!-- Logo au-dessus de la carte -->
  <div class="mb-8 text-center relative z-10 login-logo-enter">
    <div class="logo">Lumina<span>Photography</span></div>
    <p class="text-xs tracking-widest uppercase text-gray-400 mt-2">Espace administrateur</p>
  </div>

  <!-- Carte login -->
  <div class="w-full max-w-sm bg-white rounded-2xl shadow-xl overflow-hidden relative z-10 login-card-enter">

    <!-- Ligne rouge signature Lumina -->
    <div class="h-1 w-full bg-rouge"></div>

    <div class="p-10">
      <div class="login-title">Connexion</div>
      <div class="login-subtitle">Accès réservé aux administrateurs</div>

      <!-- Onglets -->
      <div class="tabs">
        <button class="tab active" data-tab="otp">Code par email</button>
        <button class="tab" data-tab="password">Mot de passe</button>
        <span class="tab-ink"></span>
      </div>

      <!-- ── ONGLET OTP ── -->
      <div class="tab-panel active" id="panel-otp">

        <div class="otp-step1" id="otp-step1">
          <div class="field">
            <label for="otp-email">Adresse email</label>
            <input type="email" id="otp-email" placeholder="admin@luminamodels.ca" autocomplete="email" />
          </div>
          <button class="btn" id="btn-send-otp">Recevoir mon code</button>
        </div>

        <div class="otp-step2" id="otp-step2">
          <p class="msg-info">Code à 8 chiffres envoyé à <strong id="otp-email-display"></strong>. Vérifie ta boîte mail.</p>
          <div class="field">
            <label>Code à 8 chiffres</label>
            <div class="otp-boxes" id="otp-boxes">
              <input class="otp-box" type="text" maxlength="1" inputmode="numeric" autocomplete="off" />
              <input class="otp-box" type="text" maxlength="1" inputmode="numeric" autocomplete="off" />
              <input class="otp-box" type="text" maxlength="1" inputmode="numeric" autocomplete="off" />
              <input class="otp-box" type="text" maxlength="1" inputmode="numeric" autocomplete="off" />
              <input class="otp-box" type="text" maxlength="1" inputmode="numeric" autocomplete="off" />
              <input class="otp-box" type="text" maxlength="1" inputmode="numeric" autocomplete="off" />
              <input class="otp-box" type="text" maxlength="1" inputmode="numeric" autocomplete="off" />
              <input class="otp-box" type="text" maxlength="1" inputmode="numeric" autocomplete="off" />
            </div>
          </div>
          <button class="btn" id="btn-verify-otp">Connexion</button>
          <button class="btn btn-secondary" id="btn-resend">Renvoyer le code</button>
        </div>

        <p class="msg-error" id="otp-error"></p>
      </div>

      <!-- ── ONGLET MOT DE PASSE ── -->
      <div class="tab-panel" id="panel-password">
        <div class="field">
          <label for="pw-email">Adresse email</label>
          <input type="email" id="pw-email" placeholder="admin@luminamodels.ca" autocomplete="email" />
        </div>
        <div class="field">
          <label for="pw-password">Mot de passe</label>
          <input type="password" id="pw-password" placeholder="••••••••" autocomplete="current-password" />
        </div>
        <button class="btn" id="btn-login">Se connecter</button>
        <p class="msg-error" id="pw-error"></p>
      </div>
    </div>
  </div>

  <!-- Lien discret -->
  <p class="mt-6 text-xs text-gray-300 tracking-widest relative z-10">luminamodels.ca</p>

  <script>
    /* ── Tab indicator glissant ─────────────────────────────── */
    const tabInk = document.querySelector('.tab-ink');

    function moveTabInk(tab) {
      if (!tabInk) return;
      tabInk.style.left  = tab.offsetLeft + 'px';
      tabInk.style.width = tab.offsetWidth + 'px';
    }

    /* Position initiale sur l'onglet actif */
    const firstActiveTab = document.querySelector('.tab.active');
    if (firstActiveTab) moveTabInk(firstActiveTab);

    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', function () {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        this.classList.add('active');
        document.getElementById(`panel-${this.dataset.tab}`).classList.add('active');
        moveTabInk(this);
      });
    });

    /* ── Erreurs avec animation shake ──────────────────────── */
    function showError(id, msg) {
      const el = document.getElementById(id);
      el.textContent = msg;
      el.classList.remove('shake');
      void el.offsetWidth; /* reflow pour relancer l'animation */
      el.classList.add('visible', 'shake');
    }

    function hideError(id) {
      document.getElementById(id).classList.remove('visible', 'shake');
    }

    function saveAndRedirect(token) {
      sessionStorage.setItem('admin_token', token);
      window.location.href = '/admin.html';
    }

    /* ── OTP — 6 cases avec auto-avance ────────────────────── */
    const otpBoxes = document.querySelectorAll('.otp-box');

    otpBoxes.forEach((box, i) => {
      box.addEventListener('input', () => {
        box.value = box.value.replace(/\D/g, '');
        if (box.value) {
          box.classList.add('filled');
          if (i < otpBoxes.length - 1) otpBoxes[i + 1].focus();
        } else {
          box.classList.remove('filled');
        }
      });

      box.addEventListener('keydown', e => {
        if (e.key === 'Backspace' && !box.value && i > 0) {
          otpBoxes[i - 1].value = '';
          otpBoxes[i - 1].classList.remove('filled');
          otpBoxes[i - 1].focus();
        }
        if (e.key === 'Enter') verifyOtp();
      });

      /* Coller un code copié remplit automatiquement les 6 cases */
      box.addEventListener('paste', e => {
        e.preventDefault();
        const text = (e.clipboardData || window.clipboardData)
          .getData('text').replace(/\D/g, '').slice(0, 6);
        otpBoxes.forEach((b, j) => {
          b.value = text[j] || '';
          b.classList.toggle('filled', !!b.value);
        });
        const nextEmpty = [...otpBoxes].findIndex(b => !b.value);
        (nextEmpty === -1 ? otpBoxes[5] : otpBoxes[nextEmpty]).focus();
      });
    });

    /* ── OTP step 1 : envoyer le code ──────────────────────── */
    async function sendOtp() {
      const email = document.getElementById('otp-email').value.trim();
      if (!email) return showError('otp-error', 'Saisis ton email.');
      hideError('otp-error');

      const btn = document.getElementById('btn-send-otp');
      btn.disabled = true;
      btn.textContent = 'Envoi…';

      const res = await fetch('/api/otp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email }),
      });

      btn.disabled = false;
      btn.textContent = 'Recevoir mon code';

      if (!res.ok) {
        const json = await res.json();
        return showError('otp-error', json.message || 'Erreur.');
      }

      document.getElementById('otp-email-display').textContent = email;
      document.getElementById('otp-step1').classList.add('hidden');
      document.getElementById('otp-step2').classList.add('visible');
      setTimeout(() => otpBoxes[0].focus(), 100);
    }

    /* ── OTP step 2 : vérifier le code ─────────────────────── */
    async function verifyOtp() {
      const email = document.getElementById('otp-email').value.trim();
      const token = [...otpBoxes].map(b => b.value).join('');
      if (token.length < 8) return showError('otp-error', 'Saisis les 8 chiffres.');
      hideError('otp-error');

      const btn = document.getElementById('btn-verify-otp');
      btn.disabled = true;
      btn.textContent = 'Vérification…';

      const res = await fetch('/api/verify-otp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, token }),
      });

      const json = await res.json();
      btn.disabled = false;
      btn.textContent = 'Connexion';

      if (!json.success) return showError('otp-error', json.message || 'Code invalide.');
      saveAndRedirect(json.token);
    }

    document.getElementById('btn-send-otp').addEventListener('click', sendOtp);
    document.getElementById('btn-verify-otp').addEventListener('click', verifyOtp);

    document.getElementById('btn-resend').addEventListener('click', () => {
      document.getElementById('otp-step1').classList.remove('hidden');
      document.getElementById('otp-step2').classList.remove('visible');
      otpBoxes.forEach(b => { b.value = ''; b.classList.remove('filled'); });
      hideError('otp-error');
    });

    /* ── Connexion mot de passe ─────────────────────────────── */
    document.getElementById('btn-login').addEventListener('click', async function () {
      const email    = document.getElementById('pw-email').value.trim();
      const password = document.getElementById('pw-password').value;
      if (!email || !password) return showError('pw-error', 'Remplis tous les champs.');
      hideError('pw-error');

      this.disabled = true;
      this.textContent = 'Connexion…';

      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });

      const json = await res.json();
      this.disabled = false;
      this.textContent = 'Se connecter';

      if (!json.success) return showError('pw-error', json.message || 'Identifiants incorrects.');
      saveAndRedirect(json.token);
    });
  </script>

</body>
</html>
